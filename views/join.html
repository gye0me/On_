<!DOCTYPE html>
<html>
<head>
    <title>온-체감: 회원가입</title>
    <style>
        .join-container { max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="join-container">
        <h2>지구를 위한 첫 걸음, 회원가입</h2>
        <form action="/auth/join" method="post">
            <div class="input-group">
                <label for="email">이메일</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="nick">닉네임</label>
                <input type="text" name="nick" id="nick" required>
            </div>
            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" name="password" id="password" required>
            </div>
            <button type="submit">가입하기</button>
        </form>
        <p><a href="/">이미 계정이 있으신가요? 로그인</a></p>
    </div>
</body>
</html>
