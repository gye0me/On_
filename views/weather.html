{% extends 'layout.html' %}

{% block content %}
  <h1>{{ title }}</h1>
  <div class="weather-info">
    <p>현재 기온: <strong>{{ weather.temp }}도</strong></p>
    <p>오늘의 추천 겉옷: {{ weather.outer }}</p>
    <p>상의: {{ weather.top }} / 하의: {{ weather.bottom }}</p>
    <p>탄소배출계수: {{ weather.carbonIndex }}</p> </div>
{% endblock %}
