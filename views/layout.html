<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
      body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
      .container { max-width: 600px; margin: 0 auto; border: 1px solid #ccc; padding: 20px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div class="container">
      {% block content %}
      {% endblock %}
    </div>
    {% if user and user.id %}
      <div class="user-info">
        <span>안녕하세요, {{user.nick}}님!</span>
        <a href="/auth/logout" class="btn">로그아웃</a>
      </div>
    {% else %}
      <div class="login-buttons">
        <a href="/auth/kakao" class="btn-kakao">카카오 로그인</a>
        </div>
    {% endif %}
  </body>
</html>
